syntax = "proto3";

package sandy.server;

service SandyInference {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ModelInfo(ModelInfoRequest) returns (ModelInfoResponse);
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  rpc GenerateStream(GenerateRequest) returns (stream GenerateStreamResponse);
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string message = 2;
}

message ModelInfoRequest {}

message ModelInfoResponse {
  string model_id = 1;
  string backend = 2;
  int32 max_context_tokens = 3;
}

message GenerateRequest {
  string request_id = 1;
  repeated int64 input_ids = 2;
  int32 max_tokens = 3;
  repeated int64 stop_token_ids = 4;
  optional float temperature = 5;
  optional float top_p = 6;
}

message GenerateResponse {
  string request_id = 1;
  repeated int64 output_ids = 2;
  string finish_reason = 3;
  int32 prompt_tokens = 4;
  int32 completion_tokens = 5;
  string error = 6;
}

message GenerateStreamResponse {
  string request_id = 1;
  oneof event {
    GenerateToken token = 2;
    GenerateDone done = 3;
    GenerateError error = 4;
  }
}

message GenerateToken {
  int64 token_id = 1;
}

message GenerateDone {
  string finish_reason = 1;
  int32 prompt_tokens = 2;
  int32 completion_tokens = 3;
}

message GenerateError {
  string message = 1;
}
